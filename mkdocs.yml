site_name: MBG-Kes
site_description: Documentation for the MBG-Kes Chaos Zero Nightmare automation tool
site_url: https://baoxin1100.github.io/ok-kes/
repo_url: https://github.com/baoxin1100/ok-kes
repo_name: baoxin1100/ok-kes
edit_uri: edit/master/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Guide:
      - Project Overview: zh-CN/index.md
      - Usage Guide: zh-CN/usage-guide.md
  - English: en/index.md
  - Development:
      - Development Guide: development/index.md
      - Requirements & Design: srd.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

plugins:
  - search

strict: true
