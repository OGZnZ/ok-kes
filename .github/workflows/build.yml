name: Build

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as a GitHub Release'
        required: true
        type: boolean
        default: true
      version_tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ '3.12' ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Inline ok-script requirements
        run: |
          python -m ok.update.inline_ok_requirements --tag ${{ github.ref_name || 'v1.0.0' }}

      - name: Run tests
        run: |
          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              python -m unittest $_.FullName
          }

      - name: Sync Repositories
        id: sync
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        if: env.CNB_TOKEN != ''
        uses: ok-oldking/partial-sync-repo@master
        with:
          repos: |
            https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/baoxin1100/ok-kes.git
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: true

      - name: Build with PyAppify Action
        id: build-app
        uses: ok-oldking/pyappify-action@master

      - name: Upload Compiled Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MBG-Kes-Windows-Setup
          path: pyappify_dist/*

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag || 'v1.0.0' }}
          name: MBG-Kes ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version_tag || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ### MBG-Kes Release
            Automated standalone build for MBG-Kes (*Chaos Zero Nightmare* Assistant).

            ### Download
            * Download the standalone installer package below: `MBG-Kes-win32-China-setup.exe`
          files: pyappify_dist/*
